appId: com.innerhop.desktop
productName: InnerHop
directories:
  output: release
  buildResources: resources
files:
  - out/**/*
  - resources/**/*
  - package.json
asar: true
win:
  icon: resources/icon.png
  signAndEditExecutable: false
  target:
    - target: dir
      arch:
        - x64
    - target: zip
      arch:
        - x64
mac:
  icon: resources/icon.png
  category: public.app-category.developer-tools
  identity: null
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
linux:
  icon: resources/icon.png
  executableName: innerhop
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
  category: Development
  target:
    - target: AppImage
      arch:
        - x64
    - target: tar.gz
      arch:
        - x64
